<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mental Coach</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Segoe+UI:wght@300;400;600&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0a1628 0%, #0d2b5e 30%, #1a4a8a 60%, #2d6bb5 80%, #4a90d9 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Aero ambient light blobs */
    body::before {
      content: '';
      position: fixed;
      top: -200px;
      left: -200px;
      width: 700px;
      height: 700px;
      background: radial-gradient(circle, rgba(100, 180, 255, 0.15) 0%, transparent 70%);
      pointer-events: none;
    }

    body::after {
      content: '';
      position: fixed;
      bottom: -150px;
      right: -150px;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(60, 120, 220, 0.12) 0%, transparent 70%);
      pointer-events: none;
    }

    /* Window chrome */
    .window {
      width: 680px;
      max-width: 95vw;
      border-radius: 8px;
      overflow: hidden;
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.18),
        0 0 0 2px rgba(0,0,0,0.4),
        0 20px 60px rgba(0,0,0,0.6),
        inset 0 1px 0 rgba(255,255,255,0.3);
      backdrop-filter: blur(20px) saturate(1.4);
      -webkit-backdrop-filter: blur(20px) saturate(1.4);
      background: rgba(30, 70, 140, 0.35);
      position: relative;
      z-index: 10;
    }

    /* Title bar */
    .titlebar {
      display: flex;
      align-items: center;
      padding: 8px 12px;
      background: linear-gradient(180deg,
        rgba(180, 220, 255, 0.45) 0%,
        rgba(80, 150, 230, 0.35) 50%,
        rgba(40, 100, 200, 0.4) 100%
      );
      border-bottom: 1px solid rgba(255,255,255,0.15);
      user-select: none;
      position: relative;
    }

    /* Glass shine on titlebar */
    .titlebar::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 50%;
      background: linear-gradient(180deg, rgba(255,255,255,0.25) 0%, transparent 100%);
      border-radius: 8px 8px 0 0;
      pointer-events: none;
    }

    .titlebar-icon {
      width: 18px;
      height: 18px;
      margin-right: 8px;
      opacity: 0.9;
    }

    .titlebar-title {
      flex: 1;
      font-size: 12px;
      font-weight: 400;
      color: rgba(255,255,255,0.95);
      text-shadow: 0 1px 3px rgba(0,0,0,0.5);
      letter-spacing: 0.3px;
    }

    /* Window control buttons */
    .window-controls {
      display: flex;
      gap: 4px;
    }

    .wc-btn {
      width: 26px;
      height: 18px;
      border-radius: 3px;
      border: 1px solid rgba(255,255,255,0.2);
      background: linear-gradient(180deg, rgba(255,255,255,0.3) 0%, rgba(180,210,255,0.15) 100%);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      color: rgba(255,255,255,0.85);
      transition: background 0.15s;
    }

    .wc-btn:hover { background: linear-gradient(180deg, rgba(255,255,255,0.45) 0%, rgba(180,210,255,0.3) 100%); }
    .wc-btn.close:hover { background: linear-gradient(180deg, rgba(255,80,80,0.7) 0%, rgba(200,30,30,0.6) 100%); }

    /* Main content area */
    .content {
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Header */
    .app-header {
      text-align: center;
      padding: 8px 0 4px;
    }

    .app-title {
      font-size: 22px;
      font-weight: 300;
      color: rgba(255,255,255,0.95);
      text-shadow: 0 0 20px rgba(120,190,255,0.6), 0 2px 4px rgba(0,0,0,0.4);
      letter-spacing: 1px;
    }

    .app-subtitle {
      font-size: 11px;
      color: rgba(180,215,255,0.7);
      margin-top: 3px;
      letter-spacing: 0.5px;
    }

    /* Chat window */
    .chat-panel {
      background: rgba(10, 30, 70, 0.45);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 6px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), 0 2px 8px rgba(0,0,0,0.3);
      height: 340px;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scroll-behavior: smooth;
    }

    .chat-panel::-webkit-scrollbar {
      width: 6px;
    }
    .chat-panel::-webkit-scrollbar-track {
      background: rgba(255,255,255,0.04);
      border-radius: 3px;
    }
    .chat-panel::-webkit-scrollbar-thumb {
      background: rgba(100,170,255,0.3);
      border-radius: 3px;
    }

    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: rgba(150,195,255,0.4);
      font-size: 13px;
      gap: 10px;
    }

    .empty-state svg {
      opacity: 0.3;
    }

    /* Messages */
    .message {
      display: flex;
      flex-direction: column;
      max-width: 82%;
      animation: fadeSlide 0.25s ease;
    }

    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .message.user {
      align-self: flex-end;
      align-items: flex-end;
    }

    .message.assistant {
      align-self: flex-start;
      align-items: flex-start;
    }

    .message-label {
      font-size: 10px;
      color: rgba(150,195,255,0.5);
      margin-bottom: 3px;
      letter-spacing: 0.4px;
    }

    .bubble {
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 13px;
      line-height: 1.55;
      color: rgba(235,248,255,0.95);
      word-break: break-word;
      position: relative;
    }

    .message.user .bubble {
      background: linear-gradient(135deg, rgba(60,130,240,0.65) 0%, rgba(40,100,200,0.55) 100%);
      border: 1px solid rgba(100,170,255,0.3);
      box-shadow: 0 2px 8px rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.15);
    }

    .message.assistant .bubble {
      background: linear-gradient(135deg, rgba(20,60,130,0.6) 0%, rgba(15,45,110,0.5) 100%);
      border: 1px solid rgba(80,140,220,0.2);
      box-shadow: 0 2px 8px rgba(0,0,0,0.2), inset 0 1px 0 rgba(255,255,255,0.08);
    }

    /* Typing indicator */
    .typing .bubble {
      display: flex;
      gap: 5px;
      align-items: center;
      padding: 12px 16px;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(120,190,255,0.7);
      animation: bounce 1.2s infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
      30% { transform: translateY(-5px); opacity: 1; }
    }

    /* Input row */
    .input-row {
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

    .input-wrap {
      flex: 1;
      position: relative;
    }

    textarea {
      width: 100%;
      min-height: 44px;
      max-height: 120px;
      resize: none;
      padding: 11px 14px;
      font-family: inherit;
      font-size: 13px;
      color: rgba(235,248,255,0.95);
      background: rgba(10, 30, 70, 0.5);
      border: 1px solid rgba(100,160,240,0.25);
      border-radius: 6px;
      outline: none;
      line-height: 1.5;
      transition: border-color 0.2s, box-shadow 0.2s;
      box-shadow: inset 0 1px 3px rgba(0,0,0,0.3);
    }

    textarea::placeholder {
      color: rgba(120,170,230,0.45);
    }

    textarea:focus {
      border-color: rgba(100,170,255,0.55);
      box-shadow: inset 0 1px 3px rgba(0,0,0,0.3), 0 0 0 3px rgba(60,130,240,0.15);
    }

    /* Send button — Vista-style glassy pill */
    .send-btn {
      height: 44px;
      padding: 0 20px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      color: rgba(255,255,255,0.95);
      letter-spacing: 0.3px;
      position: relative;
      overflow: hidden;
      background: linear-gradient(180deg,
        rgba(100,170,255,0.75) 0%,
        rgba(50,120,230,0.8) 48%,
        rgba(30,90,200,0.85) 52%,
        rgba(20,70,180,0.9) 100%
      );
      border: 1px solid rgba(150,200,255,0.35);
      box-shadow: 0 2px 8px rgba(0,0,80,0.4), inset 0 1px 0 rgba(255,255,255,0.35);
      transition: filter 0.15s, transform 0.1s;
      white-space: nowrap;
    }

    /* Glass shine overlay */
    .send-btn::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 50%;
      background: linear-gradient(180deg, rgba(255,255,255,0.35) 0%, rgba(255,255,255,0.05) 100%);
      pointer-events: none;
    }

    .send-btn:hover { filter: brightness(1.15); }
    .send-btn:active { transform: translateY(1px); filter: brightness(0.95); }
    .send-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    /* Divider */
    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(100,170,255,0.2), transparent);
    }

    /* Status bar */
    .statusbar {
      padding: 6px 24px 14px;
      font-size: 10px;
      color: rgba(120,175,240,0.4);
      text-align: right;
      letter-spacing: 0.3px;
    }
  </style>
</head>
<body>

<div class="window">
  <!-- Title bar -->
  <div class="titlebar">
    <svg class="titlebar-icon" viewBox="0 0 18 18" fill="none">
      <circle cx="9" cy="9" r="8" fill="rgba(120,190,255,0.5)" stroke="rgba(200,230,255,0.4)" stroke-width="0.8"/>
      <path d="M9 5v5l3 2" stroke="white" stroke-width="1.2" stroke-linecap="round"/>
    </svg>
    <span class="titlebar-title">Mental Coach — Powered by AI</span>
    <div class="window-controls">
      <div class="wc-btn">&#x2212;</div>
      <div class="wc-btn">&#x25A1;</div>
      <div class="wc-btn close">&#x2715;</div>
    </div>
  </div>

  <!-- Body -->
  <div class="content">
    <div class="app-header">
      <div class="app-title">Mental Coach</div>
      <div class="app-subtitle">Your supportive AI companion</div>
    </div>

    <div class="chat-panel" id="chatPanel">
      <div class="empty-state" id="emptyState">
        <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
          <circle cx="20" cy="20" r="18" stroke="rgba(120,190,255,0.6)" stroke-width="1.5"/>
          <path d="M13 20c0-3.866 3.134-7 7-7s7 3.134 7 7-3.134 7-7 7" stroke="rgba(120,190,255,0.6)" stroke-width="1.5" stroke-linecap="round"/>
          <circle cx="20" cy="20" r="2" fill="rgba(120,190,255,0.6)"/>
        </svg>
        <span>Start a conversation&hellip;</span>
      </div>
    </div>

    <div class="input-row">
      <div class="input-wrap">
        <textarea
          id="msgInput"
          placeholder="What's on your mind?"
          rows="1"
        ></textarea>
      </div>
      <button class="send-btn" id="sendBtn" onclick="sendMessage()">Send</button>
    </div>
  </div>

  <div class="divider"></div>
  <div class="statusbar" id="statusBar">Ready</div>
</div>

<script>
  const API = 'http://localhost:8000';
  const panel = document.getElementById('chatPanel');
  const input = document.getElementById('msgInput');
  const sendBtn = document.getElementById('sendBtn');
  const statusBar = document.getElementById('statusBar');
  const emptyState = document.getElementById('emptyState');

  // Auto-resize textarea
  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
  });

  // Send on Enter (Shift+Enter for newline)
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  function addMessage(role, text) {
    emptyState.style.display = 'none';
    const msg = document.createElement('div');
    msg.className = `message ${role}`;
    msg.innerHTML = `
      <div class="message-label">${role === 'user' ? 'You' : 'Coach'}</div>
      <div class="bubble">${escapeHtml(text)}</div>
    `;
    panel.appendChild(msg);
    panel.scrollTop = panel.scrollHeight;
    return msg;
  }

  function addTyping() {
    emptyState.style.display = 'none';
    const msg = document.createElement('div');
    msg.className = 'message assistant typing';
    msg.innerHTML = `
      <div class="message-label">Coach</div>
      <div class="bubble"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
    `;
    panel.appendChild(msg);
    panel.scrollTop = panel.scrollHeight;
    return msg;
  }

  function escapeHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
  }

  async function sendMessage() {
    const text = input.value.trim();
    if (!text) return;

    input.value = '';
    input.style.height = 'auto';
    sendBtn.disabled = true;
    statusBar.textContent = 'Sending…';

    addMessage('user', text);
    const typingEl = addTyping();

    try {
      const res = await fetch(`${API}/api/chat`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text }),
      });

      typingEl.remove();

      if (!res.ok) {
        const err = await res.json().catch(() => ({ detail: 'Unknown error' }));
        addMessage('assistant', `Error: ${err.detail}`);
        statusBar.textContent = 'Error from server';
      } else {
        const data = await res.json();
        addMessage('assistant', data.reply);
        statusBar.textContent = 'Reply received';
      }
    } catch (e) {
      typingEl.remove();
      addMessage('assistant', 'Could not reach the server. Make sure the backend is running.');
      statusBar.textContent = 'Connection failed';
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  }
</script>
</body>
</html>

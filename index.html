<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="app-secret" content="70dc0525782c12c596dee6a27ea35a9c74eaf997" />
  <title>Mental Coach — AI Companion</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Segoe+UI:wght@300;400;600&family=Inter:wght@300;400;500;600&display=swap');

    :root {
      --glass-bg: rgba(15, 40, 100, 0.38);
      --glass-border: rgba(140, 195, 255, 0.18);
      --glass-shine: rgba(255,255,255,0.12);
      --blue-glow: rgba(80, 160, 255, 0.35);
      --text-primary: rgba(235, 248, 255, 0.95);
      --text-muted: rgba(140, 190, 240, 0.55);
      --accent: #4fa3f7;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: 'Inter', 'Segoe UI', Tahoma, sans-serif;
      background: #050d1f;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* ── Animated background ── */
    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
    }

    /* Deep gradient base */
    .bg-gradient {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 20% 10%, rgba(30, 80, 180, 0.5) 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 80% 90%, rgba(10, 50, 140, 0.45) 0%, transparent 60%),
        radial-gradient(ellipse 50% 40% at 60% 40%, rgba(50, 110, 220, 0.2) 0%, transparent 55%),
        linear-gradient(160deg, #050d1f 0%, #091a3e 40%, #0c2252 70%, #0a1830 100%);
    }

    /* Animated orbs */
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      animation: drift linear infinite;
      opacity: 0;
    }
    .orb1 {
      width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(40, 120, 255, 0.18) 0%, transparent 70%);
      top: -100px; left: -100px;
      animation-duration: 25s; animation-delay: 0s;
    }
    .orb2 {
      width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(80, 160, 255, 0.12) 0%, transparent 70%);
      bottom: -80px; right: -80px;
      animation-duration: 30s; animation-delay: -10s;
    }
    .orb3 {
      width: 300px; height: 300px;
      background: radial-gradient(circle, rgba(20, 80, 200, 0.15) 0%, transparent 70%);
      top: 50%; left: 60%;
      animation-duration: 20s; animation-delay: -5s;
    }

    @keyframes drift {
      0%   { opacity: 0; transform: translate(0, 0) scale(1); }
      10%  { opacity: 1; }
      90%  { opacity: 1; }
      100% { opacity: 0; transform: translate(30px, -20px) scale(1.1); }
    }

    /* Star field */
    canvas#stars {
      position: absolute;
      inset: 0;
      opacity: 0.6;
    }

    /* Scanline overlay for CRT-glass feel */
    .scanlines {
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 2px,
        rgba(0,0,0,0.04) 2px,
        rgba(0,0,0,0.04) 4px
      );
      pointer-events: none;
    }

    /* ── Main window ── */
    .window {
      position: relative;
      z-index: 10;
      width: 720px;
      max-width: 96vw;
      height: 86vh;
      max-height: 780px;
      display: flex;
      flex-direction: column;
      border-radius: 12px;
      overflow: hidden;

      /* Layered glass */
      background: var(--glass-bg);
      backdrop-filter: blur(24px) saturate(1.6) brightness(1.05);
      -webkit-backdrop-filter: blur(24px) saturate(1.6) brightness(1.05);

      /* Borders & shadow */
      border: 1px solid var(--glass-border);
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.06) inset,
        0 1px 0 rgba(255,255,255,0.22) inset,
        0 30px 80px rgba(0, 0, 0, 0.7),
        0 0 60px rgba(40, 100, 255, 0.12);
    }

    /* Animated glow border */
    .window::before {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: 13px;
      background: linear-gradient(135deg,
        rgba(100, 180, 255, 0.4) 0%,
        rgba(40, 100, 220, 0.1) 40%,
        rgba(80, 160, 255, 0.3) 70%,
        rgba(140, 200, 255, 0.4) 100%
      );
      z-index: -1;
      animation: borderGlow 6s ease-in-out infinite alternate;
    }

    @keyframes borderGlow {
      0%   { opacity: 0.5; }
      100% { opacity: 1; }
    }

    /* Top shine streak */
    .window::after {
      content: '';
      position: absolute;
      top: 0; left: 10%; right: 10%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(200,230,255,0.6), transparent);
      z-index: 20;
      pointer-events: none;
    }

    /* ── Title bar ── */
    .titlebar {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      padding: 0 14px;
      height: 40px;
      background: linear-gradient(180deg,
        rgba(160, 210, 255, 0.28) 0%,
        rgba(80,  150, 240, 0.22) 48%,
        rgba(40,  100, 210, 0.28) 52%,
        rgba(20,   70, 180, 0.30) 100%
      );
      border-bottom: 1px solid rgba(100, 170, 255, 0.15);
      position: relative;
      user-select: none;
    }

    /* Glass shine strip */
    .titlebar::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 50%;
      background: linear-gradient(180deg, rgba(255,255,255,0.18) 0%, transparent 100%);
      pointer-events: none;
    }

    .tb-icon {
      width: 20px; height: 20px;
      margin-right: 9px;
      flex-shrink: 0;
      filter: drop-shadow(0 0 4px rgba(100,180,255,0.8));
    }

    .tb-title {
      flex: 1;
      font-size: 12px;
      font-weight: 400;
      color: rgba(220, 240, 255, 0.9);
      text-shadow: 0 1px 4px rgba(0,0,0,0.6);
      letter-spacing: 0.4px;
    }

    .wc { display: flex; gap: 5px; }

    .wc-btn {
      width: 28px; height: 20px;
      border-radius: 4px;
      border: 1px solid rgba(255,255,255,0.18);
      background: linear-gradient(180deg, rgba(255,255,255,0.22) 0%, rgba(120,180,255,0.12) 100%);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 9px; color: rgba(220,240,255,0.8);
      transition: all 0.15s;
      box-shadow: 0 1px 0 rgba(255,255,255,0.15) inset;
    }
    .wc-btn:hover { background: linear-gradient(180deg, rgba(255,255,255,0.38) 0%, rgba(150,200,255,0.25) 100%); }
    .wc-btn.cls:hover { background: linear-gradient(180deg, rgba(255,90,90,0.7) 0%, rgba(200,30,30,0.65) 100%); border-color: rgba(255,140,140,0.4); }

    /* ── Header panel ── */
    .header-panel {
      flex-shrink: 0;
      padding: 18px 24px 14px;
      background: linear-gradient(180deg, rgba(20, 55, 130, 0.25) 0%, transparent 100%);
      border-bottom: 1px solid rgba(80, 140, 220, 0.12);
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .avatar {
      width: 48px; height: 48px;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(60,130,240,0.6), rgba(20,70,180,0.8));
      border: 1.5px solid rgba(120,190,255,0.35);
      box-shadow: 0 0 16px rgba(60,140,255,0.3), inset 0 1px 0 rgba(255,255,255,0.2);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      position: relative;
      overflow: hidden;
    }

    /* Avatar shine */
    .avatar::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 50%;
      background: linear-gradient(180deg, rgba(255,255,255,0.25) 0%, transparent 100%);
      border-radius: 50% 50% 0 0;
    }

    .avatar svg { position: relative; z-index: 1; }

    .header-text { flex: 1; }

    .header-name {
      font-size: 16px;
      font-weight: 500;
      color: var(--text-primary);
      text-shadow: 0 0 20px rgba(100,180,255,0.4);
      letter-spacing: 0.3px;
    }

    .header-status {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .status-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #4ade80;
      box-shadow: 0 0 6px rgba(74,222,128,0.7);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.5; }
    }

    /* Mood pills */
    .mood-pills {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    .pill {
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 11px;
      color: rgba(160,210,255,0.8);
      border: 1px solid rgba(80,150,230,0.25);
      background: rgba(20,60,140,0.35);
      cursor: pointer;
      transition: all 0.2s;
      backdrop-filter: blur(4px);
    }
    .pill:hover {
      border-color: rgba(100,180,255,0.5);
      background: rgba(40,90,200,0.4);
      color: rgba(200,235,255,0.95);
      box-shadow: 0 0 10px rgba(60,140,255,0.2);
    }

    /* ── Chat area ── */
    .chat-scroll {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }

    .chat-scroll::-webkit-scrollbar { width: 5px; }
    .chat-scroll::-webkit-scrollbar-track { background: transparent; }
    .chat-scroll::-webkit-scrollbar-thumb {
      background: rgba(80,150,230,0.25);
      border-radius: 3px;
    }

    /* Empty state */
    .empty {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      color: var(--text-muted);
      font-size: 13px;
      text-align: center;
      padding: 40px;
    }

    .empty-icon {
      width: 56px; height: 56px;
      border-radius: 50%;
      border: 1.5px solid rgba(80,150,230,0.2);
      display: flex; align-items: center; justify-content: center;
      opacity: 0.5;
    }

    .empty p { max-width: 220px; line-height: 1.6; }

    /* Suggestions */
    .suggestions {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 4px;
    }

    .suggestion {
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 12px;
      color: rgba(140,200,255,0.75);
      border: 1px solid rgba(60,130,220,0.2);
      background: rgba(15,45,110,0.3);
      cursor: pointer;
      text-align: left;
      transition: all 0.2s;
      width: 100%;
      max-width: 320px;
    }
    .suggestion:hover {
      border-color: rgba(100,170,255,0.45);
      background: rgba(30,70,170,0.4);
      color: rgba(200,235,255,0.9);
      transform: translateX(4px);
    }

    /* ── Messages ── */
    .msg {
      display: flex;
      flex-direction: column;
      max-width: 78%;
      animation: msgIn 0.3s cubic-bezier(0.34, 1.2, 0.64, 1);
    }

    @keyframes msgIn {
      from { opacity: 0; transform: translateY(12px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .msg.user   { align-self: flex-end; align-items: flex-end; }
    .msg.coach  { align-self: flex-start; align-items: flex-start; }

    .msg-meta {
      font-size: 10px;
      color: var(--text-muted);
      margin-bottom: 5px;
      letter-spacing: 0.3px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .msg-time {
      opacity: 0.6;
    }

    .bubble {
      padding: 11px 16px;
      border-radius: 10px;
      font-size: 13.5px;
      line-height: 1.6;
      color: var(--text-primary);
      word-break: break-word;
      position: relative;
      overflow: hidden;
    }

    /* Bubble shine */
    .bubble::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 45%;
      background: linear-gradient(180deg, rgba(255,255,255,0.09) 0%, transparent 100%);
      pointer-events: none;
    }

    .msg.user .bubble {
      background: linear-gradient(135deg,
        rgba(65, 140, 255, 0.6) 0%,
        rgba(35, 100, 220, 0.65) 100%
      );
      border: 1px solid rgba(110, 175, 255, 0.3);
      border-bottom-right-radius: 3px;
      box-shadow:
        0 4px 16px rgba(0,0,0,0.3),
        0 0 20px rgba(50,120,255,0.12),
        inset 0 1px 0 rgba(255,255,255,0.18);
    }

    .msg.coach .bubble {
      background: linear-gradient(135deg,
        rgba(18, 52, 130, 0.65) 0%,
        rgba(12, 38, 100, 0.6) 100%
      );
      border: 1px solid rgba(70, 130, 210, 0.22);
      border-bottom-left-radius: 3px;
      box-shadow:
        0 4px 16px rgba(0,0,0,0.25),
        inset 0 1px 0 rgba(255,255,255,0.08);
    }

    /* Typing dots */
    .typing .bubble {
      display: flex; gap: 6px; align-items: center;
      padding: 14px 18px;
    }

    .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: rgba(100, 180, 255, 0.65);
      box-shadow: 0 0 6px rgba(80,160,255,0.5);
      animation: typingBounce 1.3s ease-in-out infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.18s; }
    .dot:nth-child(3) { animation-delay: 0.36s; }

    @keyframes typingBounce {
      0%, 60%, 100% { transform: translateY(0);  opacity: 0.45; }
      30%            { transform: translateY(-6px); opacity: 1; }
    }

    /* ── Input area ── */
    .input-area {
      flex-shrink: 0;
      padding: 14px 20px 18px;
      background: linear-gradient(0deg, rgba(5, 20, 60, 0.5) 0%, transparent 100%);
      border-top: 1px solid rgba(60, 120, 200, 0.15);
    }

    .input-row {
      display: flex;
      gap: 10px;
      align-items: flex-end;
      background: rgba(8, 25, 70, 0.5);
      border: 1px solid rgba(80, 150, 230, 0.22);
      border-radius: 10px;
      padding: 6px 6px 6px 14px;
      box-shadow:
        inset 0 1px 4px rgba(0,0,0,0.4),
        0 0 0 1px rgba(255,255,255,0.04) inset;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .input-row:focus-within {
      border-color: rgba(100, 170, 255, 0.45);
      box-shadow:
        inset 0 1px 4px rgba(0,0,0,0.4),
        0 0 0 3px rgba(50, 120, 240, 0.12),
        0 0 20px rgba(50,120,240,0.08);
    }

    textarea {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      resize: none;
      font-family: inherit;
      font-size: 13.5px;
      color: var(--text-primary);
      line-height: 1.55;
      padding: 6px 0;
      min-height: 32px;
      max-height: 120px;
    }

    textarea::placeholder { color: rgba(100, 160, 230, 0.4); }

    /* Send button */
    .send-btn {
      flex-shrink: 0;
      width: 38px; height: 38px;
      border-radius: 8px;
      border: 1px solid rgba(120,185,255,0.3);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      position: relative;
      overflow: hidden;
      transition: all 0.15s;

      background: linear-gradient(180deg,
        rgba(110, 180, 255, 0.7) 0%,
        rgba(60,  140, 240, 0.75) 48%,
        rgba(35,  105, 215, 0.82) 52%,
        rgba(20,   80, 195, 0.88) 100%
      );
      box-shadow:
        0 2px 10px rgba(0, 0, 80, 0.45),
        inset 0 1px 0 rgba(255,255,255,0.38),
        inset 0 -1px 0 rgba(0,0,80,0.2);
    }

    .send-btn::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 52%;
      background: linear-gradient(180deg, rgba(255,255,255,0.3) 0%, rgba(255,255,255,0.04) 100%);
      pointer-events: none;
    }

    .send-btn:hover {
      filter: brightness(1.18);
      box-shadow:
        0 4px 16px rgba(0, 0, 80, 0.5),
        0 0 16px rgba(80, 160, 255, 0.25),
        inset 0 1px 0 rgba(255,255,255,0.38);
    }

    .send-btn:active  { transform: translateY(1px); filter: brightness(0.92); }
    .send-btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; filter: none; }

    .send-btn svg { position: relative; z-index: 1; }

    /* Input hint */
    .input-hint {
      margin-top: 8px;
      font-size: 10px;
      color: rgba(80, 140, 220, 0.35);
      text-align: right;
      letter-spacing: 0.2px;
    }

    /* ── Divider ── */
    hr.sep {
      border: none;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(80,150,230,0.2), transparent);
    }
  </style>
</head>
<body>

<!-- Background layers -->
<div class="bg">
  <div class="bg-gradient"></div>
  <canvas id="stars"></canvas>
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
  <div class="orb orb3"></div>
  <div class="scanlines"></div>
</div>

<!-- Main window -->
<div class="window">

  <!-- Title bar -->
  <div class="titlebar">
    <svg class="tb-icon" viewBox="0 0 20 20" fill="none">
      <circle cx="10" cy="10" r="9" fill="rgba(80,150,255,0.45)" stroke="rgba(180,220,255,0.5)" stroke-width="0.8"/>
      <path d="M10 6v5l3 2" stroke="white" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span class="tb-title">Mental Coach — AI Companion</span>
    <div class="wc">
      <div class="wc-btn">&#x2212;</div>
      <div class="wc-btn">&#x25A1;</div>
      <div class="wc-btn cls">&#x2715;</div>
    </div>
  </div>

  <!-- Header -->
  <div class="header-panel">
    <div class="avatar">
      <svg width="26" height="26" viewBox="0 0 26 26" fill="none">
        <circle cx="13" cy="10" r="5" fill="rgba(180,220,255,0.85)"/>
        <path d="M4 22c0-5 4-8 9-8s9 3 9 8" stroke="rgba(180,220,255,0.85)" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="header-text">
      <div class="header-name">Aria</div>
      <div class="header-status">
        <span class="status-dot"></span>
        <span>Your mental health companion · Always here</span>
      </div>
    </div>
    <div class="mood-pills">
      <button class="pill" onclick="quickSend('I need some motivation today')">Motivate</button>
      <button class="pill" onclick="quickSend('I am feeling anxious')">Anxious?</button>
      <button class="pill" onclick="quickSend('I need help relaxing')">Relax</button>
    </div>
  </div>

  <!-- Chat -->
  <div class="chat-scroll" id="chatScroll">
    <div class="empty" id="emptyState">
      <div class="empty-icon">
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
          <path d="M14 3C8 3 3 7.5 3 13c0 2.5 1 4.8 2.7 6.5L4 24l4.8-1.5C10.3 23.5 12 24 14 24c6 0 11-4.5 11-11S20 3 14 3z" stroke="rgba(120,190,255,0.5)" stroke-width="1.4" stroke-linejoin="round"/>
        </svg>
      </div>
      <p>What's on your mind today?<br/>I'm here to listen.</p>
      <div class="suggestions">
        <button class="suggestion" onclick="quickSend('I\'ve been feeling stressed lately and need some guidance')">
          💭 I've been feeling stressed lately...
        </button>
        <button class="suggestion" onclick="quickSend('Can you help me build better daily habits?')">
          🌱 Help me build better daily habits
        </button>
        <button class="suggestion" onclick="quickSend('I want to improve my confidence and self-esteem')">
          ✨ I want to work on my confidence
        </button>
      </div>
    </div>
  </div>

  <!-- Input -->
  <div class="input-area">
    <div class="input-row">
      <textarea
        id="msgInput"
        placeholder="Share what's on your mind…"
        rows="1"
      ></textarea>
      <button class="send-btn" id="sendBtn" onclick="send()" title="Send (Enter)">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M2 8l12-6-6 12V9L2 8z" fill="rgba(220,240,255,0.95)" stroke="rgba(220,240,255,0.5)" stroke-width="0.4" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
    <div class="input-hint">Enter to send &nbsp;·&nbsp; Shift+Enter for new line</div>
  </div>

</div>

<script>
  // ── Star field ──
  (function() {
    const canvas = document.getElementById('stars');
    const ctx = canvas.getContext('2d');
    let stars = [];

    function resize() {
      canvas.width  = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    function initStars() {
      stars = [];
      for (let i = 0; i < 160; i++) {
        stars.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          r: Math.random() * 1.2 + 0.2,
          a: Math.random(),
          speed: Math.random() * 0.004 + 0.001,
          phase: Math.random() * Math.PI * 2,
        });
      }
    }

    function drawStars(t) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (const s of stars) {
        const alpha = 0.2 + 0.5 * Math.abs(Math.sin(t * s.speed + s.phase));
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(180, 220, 255, ${alpha * s.a})`;
        ctx.fill();
      }
      requestAnimationFrame(drawStars);
    }

    window.addEventListener('resize', () => { resize(); initStars(); });
    resize();
    initStars();
    requestAnimationFrame(drawStars);
  })();

  // ── Chat logic ──
  const API_BASE = (window.location.protocol === 'file:' ||
                    window.location.hostname === 'localhost' ||
                    window.location.hostname === '127.0.0.1')
    ? 'http://localhost:8000'
    : '';

  const APP_SECRET = document.querySelector('meta[name="app-secret"]')?.content || '';

  const scroll   = document.getElementById('chatScroll');
  const input    = document.getElementById('msgInput');
  const sendBtn  = document.getElementById('sendBtn');
  const empty    = document.getElementById('emptyState');

  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
  });

  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });

  function now() {
    return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  function escape(s) {
    return s
      .replace(/&/g,'&amp;')
      .replace(/</g,'&lt;')
      .replace(/>/g,'&gt;')
      .replace(/\n/g,'<br>');
  }

  function appendMsg(role, text) {
    if (empty) empty.style.display = 'none';

    const wrap = document.createElement('div');
    wrap.className = `msg ${role}`;
    wrap.innerHTML = `
      <div class="msg-meta">
        ${role === 'user' ? 'You' : 'Aria'}
        <span class="msg-time">${now()}</span>
      </div>
      <div class="bubble">${escape(text)}</div>
    `;
    scroll.appendChild(wrap);
    scroll.scrollTop = scroll.scrollHeight;
    return wrap;
  }

  function appendTyping() {
    if (empty) empty.style.display = 'none';
    const wrap = document.createElement('div');
    wrap.className = 'msg coach typing';
    wrap.innerHTML = `
      <div class="msg-meta">Aria</div>
      <div class="bubble">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
    `;
    scroll.appendChild(wrap);
    scroll.scrollTop = scroll.scrollHeight;
    return wrap;
  }

  async function send() {
    const text = input.value.trim();
    if (!text || sendBtn.disabled) return;

    input.value = '';
    input.style.height = 'auto';
    sendBtn.disabled = true;

    appendMsg('user', text);
    const typing = appendTyping();

    try {
      const res = await fetch(`${API_BASE}/api/chat`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          ...(APP_SECRET && { 'X-App-Secret': APP_SECRET }),
        },
        body: JSON.stringify({ message: text }),
      });

      typing.remove();

      if (!res.ok) {
        const err = await res.json().catch(() => ({ detail: 'Unknown error' }));
        appendMsg('coach', `Something went wrong: ${err.detail}`);
      } else {
        const data = await res.json();
        appendMsg('coach', data.reply);
      }
    } catch {
      typing.remove();
      appendMsg('coach', "I can't reach the server right now. Please make sure the backend is running.");
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  }

  function quickSend(text) {
    input.value = text;
    input.dispatchEvent(new Event('input'));
    send();
  }
</script>
</body>
</html>
